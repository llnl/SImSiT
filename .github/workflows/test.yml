name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f .docker/Dockerfile -t simsit .

      - name: Run tests
        run: |
          ci_env=$(bash <(curl -s https://codecov.io/env))
          docker run -v "$PWD:/simsit" $ci_env -e CI=true simsit bash -c "cd /simsit && python -m pip install -e . && pytest -v --cov --cov-report=xml"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.2.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}