name: Test build and package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pypa/build
        run: python3 -m pip install --user build

      - name: Build a binary wheel and a source tarball
        run: python3 -m build

      - uses: actions/upload-artifact@v4
        with:
          name: test-distributions
          path: dist/

  pip:
    name: pip install 📦
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: test-distributions
          path: dist/

      - name: Install built wheel
        run: python3 -m pip install dist/*.whl pytest

      - name: Test installed wheel outside the source tree
        run: |
          cp -r tests "$RUNNER_TEMP/simsit-tests"
          cd "$RUNNER_TEMP"
          python3 -m pytest simsit-tests -m "not integration"
