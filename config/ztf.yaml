outdir: output/ztf_sidereal_example
image_dir: images
reference_dir: reference

n_obs: 3
n_example: 0
n_sat: 1
seed: 57721

meta:
  description: Example sidereal-tracking simulation using a ZTF-like instrument configuration

instrument:
  passband:
    name: synthetic_optical
    wavelength_nm: [400.0, 800.0]
    throughput: [1.0, 1.0]
    reference: Synthetic top-hat template, not a measured ZTF response
  distortion:
    th: &th [0.0, 1.0]
    dthdr: [0.05, 0.05]
  vignetting:
    th: *th
    unvig: [1.0, 0.0]
  pixel_scale: 15.0
  image_shape: [6160, 6144]
  gain: 6.2
  read_noise: 8.0
  aperture: 0.3691205
  obscuration: 0.224


conditions:
  psf_fwhm_range: [2.0, 2.0]
  sky_range: [19.5, 20.8]
  zp_range: [-0.35, 0.0]

cadence:
  exptime: [30.0]

tracker:
  type: sidereal
  rot_sky_pos0: 0.0
  error:
    v_perturb: 1.0
    boresight: 0.2

# Example observing site recognized by astroplan.Observer.at_site.
sites:
  - Palomar

sat:
  mag_range: [10.0, 13.0]

catalog:
  develop: true
  gaia_dir: /path/to/local/gaia_catalog
  min_snr: 5.0
